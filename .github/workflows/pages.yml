name: Deploy DeskMCP

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read
pages: write
id-token: write

concurrency:
group: pages
cancel-in-progress: true

jobs:
deploy:
environment:
name: github-pages
url: ${{ steps.deployment.outputs.page_url }}

```
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v6

  - name: Configure GitHub Pages
    uses: actions/configure-pages@v5

  - name: Upload DeskMCP browser
    uses: actions/upload-pages-artifact@v4
    with:
      path: ./Code/폴더/DeskMCP-FINAL

  - name: Deploy
    id: deployment
    uses: actions/deploy-pages@v4
```
